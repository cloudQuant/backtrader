# CodeQL scan configuration.
#
# Scope decisions (see docs/source/developer-guide/branch-governance.md for the
# three-branch model):
#   - Only released product code under backtrader/ is security-scanned here.
#     Examples, tests, docs snapshots, studies, scripts and local tooling are
#     covered by the ruff / black / isort / mypy / bandit quality gates and the
#     pytest suites instead; they never ship in the wheel.
#   - py/missing-super-init is disabled because direct bt.Strategy subclasses
#     deliberately never call super().__init__() (Strategy.__new__ performs the
#     base initialization; a super() call would re-enter Strategy.__init__()).
#     The query fires on every example strategy and is a pure false positive.

name: "Backtrader CodeQL config"

paths-ignore:
  - docs
  - examples
  - tests
  - tools
  - studies
  - scripts
  - .joyincode
  - conftest.py

disable:
  queries:
    - py/missing-super-init
