# 013_3 — SA 中频 SimNow 示例（迭代42 标准四件套配置）
#
# 运行方式（见 README.md）：
#   python run.py                       # 干跑自检：仅校验配置结构与凭据 env 名（不联网）
#   python run.py --replay              # 离线回放：本地冻结 fixture，零网络零写入
#   python run.py --live --allow-write  # 真实 SimNow 模拟账户：有界成交往返
#
# 凭据只按名从 checkout 根 .env 读取；本文件不含任何密钥。
# 上半部分（mode 至 replay）是冻结的 iter22-sa-v0 候选参数，迭代内先于迁移与回归冻结；
# 下半部分（schema_version/venue/credentials/fronts/policy/timeouts）为迭代42 新增的
# 标准入口段，仅被 run.py 的 dry/--live 使用。

mode: shadow
environment: simnow_first_group1
candidate_id: iter22-sa-v0
instrument: null
timezone: Asia/Shanghai

# 冻结 profile 表（legacy 校验合同；--live 的实际前端选择用下方 fronts.pairs 的 env 名）。
profiles:
  simnow_first_group1:
    kind: simnow
    market_alignment: actual_market_hours
    td_front: tcp://180.168.146.187:10201
    md_front: tcp://180.168.146.187:10211
  simnow_first_group2:
    kind: simnow
    market_alignment: actual_market_hours
    td_front: tcp://180.168.146.187:10202
    md_front: tcp://180.168.146.187:10212
  simnow_second_7x24:
    kind: simnow
    market_alignment: engineering_only
    td_front: tcp://180.168.146.187:10130
    md_front: tcp://180.168.146.187:10131

contract_selection:
  mode: auto
  product: SA
  exchange: CZCE
  minimum_trading_days_to_expiry: 5
  manual_reviewed_at: null
  manual_source: null
  manual_trading_days_to_expiry: null
  manual_trading_days_source: null
  manual_trading_days_evidence_sha256: null

# Required for both automatic expiry gating and a manual frozen month. The
# artifact must follow iter22.czce-trading-calendar.v1; null fails closed.
trading_calendar:
  artifact: state/iter22-czce-2026-calendar-20260910.json
  sha256: 2b5168ef5b1f92290879dc5d8d3f1c16eefd823d9441d130d284263a34b46dc7

feed:
  timeframe: minutes
  compression: 1
  dispatch_ticks: true
  dispatch_bars: true
  backfill_start: false
  qcheck: 0.20

warmup:
  bars: 60
  quote_seconds: 60

signal:
  entry_score: 0.35
  exit_score: 0.10
  confirm_seconds: 2
  confirm_quotes: 3
  weights:
    h_imbalance: 0.45
    h_micro_dev: 0.20
    h_ofi: 0.25
    h_momentum: 0.10
    score_h: 0.40
    score_k: 0.60
    k_trend: 0.65
    k_return3: 0.35

execution:
  order_type: limit
  time_in_force: GFD
  entry_timeout_seconds: 3
  cancel_timeout_seconds: 5
  entry_protection_ticks: 1
  max_exit_requotes: 2

risk:
  lots: 1
  max_position_lots: 1
  min_hold_seconds: 60
  max_hold_seconds: 900
  daily_loss_cny: 500
  daily_loss_equity_fraction: 0.005
  maximum_consecutive_losses: 3
  cooldown_seconds: 60
  maximum_entry_attempts: 30
  maximum_write_requests: 100
  emergency_write_reserve: 20
  cash_check_enabled: true
  drain_timeout_seconds: 120

quality:
  max_quote_age_seconds: 2
  exit_quote_age_seconds: 5
  max_bar_age_seconds: 90
  maximum_spread_ticks: 2
  minimum_depth_lots: 5
  watermark_milliseconds: 500

metadata_expectation:
  price_tick: 1
  volume_multiple: 20
  minimum_order_lots: 1

fee_policy:
  require_account_verified_for_simnow: true
  conservative_manual: null
  replay_fixture:
    source: synthetic_formula_fixture
    verified: false
    open_money_rate: 0
    open_volume_rate: 2
    close_money_rate: 0
    close_volume_rate: 4
    close_today_money_rate: 0
    close_today_volume_rate: 4
    entry_slip_ticks: 1
    exit_slip_ticks: 1
    edge_buffer_ticks: 1

research:
  status: RESEARCH_NOT_ESTABLISHED

evidence:
  directory: reports
  state_directory: state
  minimum_free_bytes: 1000000000
  quote_queue_limit: 10000
  audit_queue_limit: 10000
  rotate_bytes: 100000000
  retain_trading_days: 20

replay:
  fixture: fixtures/sa_v0_replay.json
  scenario: no_signal
  hypothetical_fills: false
  starting_cash: 1000000

# ---------------------------------------------------------------------------
# 迭代42 标准入口段（dry / --live 使用；--replay 走冻结 fixture 不读此段）
# ---------------------------------------------------------------------------
schema_version: 2
venue: simnow
credentials:
  broker_id_env: CTP_BROKER_ID
  user_id_env: CTP_USER_ID
  password_env: CTP_PASSWORD
  app_id_env: CTP_APP_ID
  auth_code_env: CTP_AUTH_CODE
# live 合约：字面值或 {env: NAME}；默认从 .env 解析（与 000 认证套件同命名）。
live_contract:
  instrument: {env: CTP_INSTRUMENT}
  exchange: {env: CTP_EXCHANGE}
  hedge_flag: {env: CTP_HEDGE_FLAG}
# 1–8 组完整 MD/TD pair（env 名）。选择规则见 simnow_direct.select_front_pair：
# 每端 ≥1/3 探测成功即可选；按 max(成功中位延迟) 排序、配置序破平；
# 自动选择/回退只发生在首次写入之前。
fronts:
  pairs:
    - {td_env: CTP_TD_FRONT, md_env: CTP_MD_FRONT, kind: standard}
    - {td_env: CTP_SET1_TD_FRONT_1, md_env: CTP_SET1_MD_FRONT_1, kind: standard}
    - {td_env: CTP_SET1_TD_FRONT_2, md_env: CTP_SET1_MD_FRONT_2, kind: standard}
    - {td_env: CTP_SET1_TD_FRONT_3, md_env: CTP_SET1_MD_FRONT_3, kind: standard}
    - {td_env: CTP_SET2_TD_FRONT, md_env: CTP_SET2_MD_FRONT, kind: 7x24}
# MD 登录兼容：本账号所用 SimNow 前置以请求编号 0 + 空身份字段回应登录
# （行情采集兼容形态，仅开放行情订阅身份，不产生执行身份）；TD 身份仍严格校验。
live_market_data:
  allow_zero_login_response: true
policy:
  # 配置不能自我授权写入；--allow-write 必须在命令行显式给出。
  allow_write: false
  max_actions: 60            # 报单+撤单尝试次数上限（每次请求消耗预算）
  max_position_lots: 1
  max_fill_round_trips: 1    # 本轮验收允许的成交往返轮数
  cleanup_reserve_actions: 20
timeouts:
  login_seconds: 30
  query_seconds: 8
  stop_seconds: 12
  run_seconds: 540           # live 运行窗口（单调时钟）
  warmup_seconds: 90         # 有效 quote 预热等待上限
  signal_deadline_seconds: 300   # 预热后自然信号截止；超时且无未决单可进入 drill
  drain_seconds: 120
# drill（受控演练单）：仅当自然窗口结束、无自然订单尝试、无未决/UNKNOWN 且预检通过时允许。
drill:
  enabled: true
  max_round_trips: 1
