# CTP SimNow direct mode (iteration 62): see ../README.md for first init, restart
# reconciliation, waiting orders and manual UNKNOWN resolution.
# rb/hc are SHFE contracts; roll the 2701 contracts as they expire.
symbols:
- rb2701
- hc2701
contracts:
  rb2701:
    exchange: SHFE
    price_tick: 1.0
    multiplier: 10
  hc2701:
    exchange: SHFE
    price_tick: 1.0
    multiplier: 10
run_timeout_seconds: 300
ctp:
  env_profile: set1_group1_vpn
  instrument_environment: demo
  broker_id: '9999'
  app_id: simnow_client_test
  auth_code: '0000000000000000'
  private_topic_mode: restart
direct:
  write_admission: true
  market_clock_verification: true
broker:
  position_mode: net
  direct_funds_refresh_interval: 60
  direct_position_audit_interval: 300
  waiting_orders: true
  stop_cancel_timeout: 10
feed:
  timeframe: ticks
  compression: 1
  backfill_start: false
strategy_params:
  symbol_a: rb2701
  symbol_b: hc2701
  bar_source: ticks
  bar_seconds: 5
  spread_window: 3
  entry_edge: 1.0
  exit_edge: -999999.0
  order_size: 1
  max_roundtrips: 0
  max_bar_history: 64
  printlog: true
  open_offset: open
  close_offset: auto
  stop_after_bars: 10
  stop_after_open_position: true
  force_entry_after_bars: 4
  force_exit_after_bars: 0
  cancel_pending_after_ticks: 24
  order_exectype: limit
  price_tick: 1.0
  slippage_ticks: 2
trade_logger:
  log_ticks: false
  log_bars: false
  log_value: false
  log_positions: false
  log_position_snapshot: true
  enabled: true
