# Public placeholders only; provide protected key files and registered identities.
symbols:
- SA701
contracts:
  SA701:
    exchange: CZCE
    price_tick: 1.0
    multiplier: 20
    quantity_unit: contracts
    time_in_force: GFD
run_timeout_seconds: 0

# Iteration 67 (D67-01): explicit, read-only trading-calendar root for this example.
# Local operator-installed directory; not shipped data, not exchange truth, and the
# synthetic seed is MOCK (no trading authorization). Relative paths resolve against
# this config file's directory; environment variables are not expanded. Keep this an
# example-local path, never a production absolute path. Without a published CURRENT
# every calendar query is explicit UNKNOWN, never a guessed session. Install a
# calendar explicitly (../README.md, docs/TRADING_CALENDAR_OPERATIONS.md).
calendars:
  root: ../calendars

feed:
  timeframe: minutes
  compression: 1
  backfill_start: false
  event_time_max_age: 2.0
  receive_time_max_age: 2.0
  incomplete_volume_bars: lines
  gateway_clock_verification: false
strategy_params:
  fast_period: 5
  slow_period: 20
  order_size: 1
  price_tick: 1.0
  slippage_ticks: 2
  print_log: true
trade_logger:
  enabled: true
logging:
  level: INFO
  other_level: WARNING
broker:
  position_mode: net
gateway_resource_provider: local_files
gateway_strategy:
  schema_version: 1
  exchange_name: CTP___FUTURE
  # Every new order is submitted through the separately authorized Risk service.
  risk:
    client_config:
      client_config_schema_version: 1
      process_role: strategy_client
      registration:
        strategy_ref: replace-with-registered-strategy-uuid
      clients:
        risk:
          config_schema_version: 1
          settings:
            bindings:
            - mount: broker.risk_order
              service_id: risk
              instance_id: risk-a
              scope_ref: risk-scope
              account_ref: account
              transport_ref: risk-transport
      communication:
        config_schema_version: 1
        profiles:
          risk-transport:
            backend: zmq
            config_schema_version: 1
            endpoints:
              rpc_connect: tcp://127.0.0.1:12355
            security_profile_ref: risk-security
    route:
      mount: broker.risk_order
      service_id: risk
      instance_id: risk-a
      scope_ref: risk-scope
      scope:
        execution_domain_ref: domain
        account_ref: account
        account_refs: []
        strategy_ref: replace-with-registered-strategy-uuid
        run_id: run
        manual_book_ref: null
        portfolio_ref: null
        group_id: null
        leg_id: null
      identity:
        role: strategy_client
        principal_ref: principal
        actor_ref: replace-with-registered-strategy-uuid
        delegate_ref: null
    peer:
      role: service
      principal_ref: risk-principal
      actor_ref: risk
      delegate_ref: null
    requested_operations:
    - risk.order.reserve
    - risk.order.dispatch
    - risk.order.release
    - risk.order.status
    - risk.status
  # Execution is selected. All dates/deadlines below are expired demonstration values.
  # Before use, replace every trading_day, allowed_trading_days and absolute deadline
  # with the operator-authorized trading day and bounded deadline; never infer them
  # from the local clock. Replace each close target, grant, delegation and build ID.
  execution:
    client_config:
      client_config_schema_version: 1
      process_role: strategy_client
      registration:
        strategy_ref: replace-with-registered-strategy-uuid
      clients:
        gateway:
          config_schema_version: 1
          settings:
            bindings:
            - mount: broker.direct_write
              service_id: gateway
              instance_id: instance
              scope_ref: scope
              account_ref: account
              transport_ref: transport
            - mount: store.market
              service_id: gateway
              instance_id: instance
              scope_ref: scope
              transport_ref: transport
        execution:
          config_schema_version: 1
          settings:
            bindings:
            - mount: broker.execution_parent
              service_id: execution
              instance_id: execution-a
              scope_ref: execution-scope
              account_ref: account
              transport_ref: execution-transport
      communication:
        config_schema_version: 1
        profiles:
          transport:
            backend: zmq
            config_schema_version: 1
            endpoints:
              rpc_connect: tcp://127.0.0.1:12345
              market_connect: tcp://127.0.0.1:12346
            security_profile_ref: security
          execution-transport:
            backend: zmq
            config_schema_version: 1
            endpoints:
              rpc_connect: tcp://127.0.0.1:12365
            security_profile_ref: execution-security
    route:
      mount: broker.execution_parent
      service_id: execution
      instance_id: execution-a
      scope_ref: execution-scope
      scope:
        execution_domain_ref: domain
        account_ref: account
        account_refs: []
        strategy_ref: replace-with-registered-strategy-uuid
        run_id: run
        manual_book_ref: null
        portfolio_ref: null
        group_id: null
        leg_id: null
      identity:
        role: strategy_client
        principal_ref: principal
        actor_ref: replace-with-registered-strategy-uuid
        delegate_ref: null
    peer:
      role: service
      principal_ref: execution-principal
      actor_ref: execution
      delegate_ref: null
    requested_operations:
    - execution.parent.submit
    - execution.parent.query
    routing:
      schema_version: 2
      component: execution-a
      account_ref: account
      strategy_ref: replace-with-registered-strategy-uuid
      execution_domain_ref: domain
      grant_revision: replace-with-execution-grant-v1
      delegation:
        delegation_id: replace-with-delegation-id
        principal_ref: principal
      instruments:
      - provider: ctp
        venue: CZCE
        environment: demo
        product_type: future
        instrument_id: SA701
        native_symbol: SA701
      rules:
      - id: SA701-open
        match:
          instrument:
            provider: ctp
            venue: CZCE
            environment: demo
            product_type: future
            instrument_id: SA701
            native_symbol: SA701
          offset: open
          order_types:
          - limit
          minimum_quantity: '1'
          quantity_unit: contracts
        scheme:
          name: pass-v1
          version: 1
        schedule_binding:
          quantity_step: '1'
          price_step: '1'
          retry_limit: 0
        deadline:
          kind: absolute
          at: '2026-01-05T15:00:00+08:00'
        time_in_force: DAY
        trading_day: '20260105'
        allowed_trading_days:
        - '20260105'
      - id: SA701-close
        match:
          instrument:
            provider: ctp
            venue: CZCE
            environment: demo
            product_type: future
            instrument_id: SA701
            native_symbol: SA701
          offset: close
          order_types:
          - limit
          minimum_quantity: '1'
          quantity_unit: contracts
        scheme:
          name: pass-v1
          version: 1
        schedule_binding:
          quantity_step: '1'
          price_step: '1'
          retry_limit: 0
        deadline:
          kind: absolute
          at: '2026-01-05T15:00:00+08:00'
        time_in_force: DAY
        trading_day: '20260105'
        allowed_trading_days:
        - '20260105'
        target_position_ref: replace-SA701-position-ref
      - id: SA701-close_today
        match:
          instrument:
            provider: ctp
            venue: CZCE
            environment: demo
            product_type: future
            instrument_id: SA701
            native_symbol: SA701
          offset: close_today
          order_types:
          - limit
          minimum_quantity: '1'
          quantity_unit: contracts
        scheme:
          name: pass-v1
          version: 1
        schedule_binding:
          quantity_step: '1'
          price_step: '1'
          retry_limit: 0
        deadline:
          kind: absolute
          at: '2026-01-05T15:00:00+08:00'
        time_in_force: DAY
        trading_day: '20260105'
        allowed_trading_days:
        - '20260105'
        target_position_ref: replace-SA701-position-ref
      - id: SA701-close_yesterday
        match:
          instrument:
            provider: ctp
            venue: CZCE
            environment: demo
            product_type: future
            instrument_id: SA701
            native_symbol: SA701
          offset: close_yesterday
          order_types:
          - limit
          minimum_quantity: '1'
          quantity_unit: contracts
        scheme:
          name: pass-v1
          version: 1
        schedule_binding:
          quantity_step: '1'
          price_step: '1'
          retry_limit: 0
        deadline:
          kind: absolute
          at: '2026-01-05T15:00:00+08:00'
        time_in_force: DAY
        trading_day: '20260105'
        allowed_trading_days:
        - '20260105'
        target_position_ref: replace-SA701-position-ref
      algorithm_build_id: replace-with-approved-build-id
  client_config:
    client_config_schema_version: 1
    process_role: strategy_client
    registration:
      strategy_ref: replace-with-registered-strategy-uuid
    clients:
      gateway:
        config_schema_version: 1
        settings:
          bindings:
          - mount: broker.direct_write
            service_id: gateway
            instance_id: instance
            scope_ref: scope
            account_ref: account
            transport_ref: transport
          - mount: store.market
            service_id: gateway
            instance_id: instance
            scope_ref: scope
            transport_ref: transport
    communication:
      config_schema_version: 1
      profiles:
        transport:
          backend: zmq
          config_schema_version: 1
          endpoints:
            rpc_connect: tcp://127.0.0.1:12345
            market_connect: tcp://127.0.0.1:12346
          security_profile_ref: security
  binding:
    journal_id: journal
    account_scope: account
    strategy_scope: replace-with-registered-strategy-uuid
    principal: principal
  route:
    mount: broker.direct_write
    service_id: gateway
    instance_id: instance
    scope_ref: scope
    scope:
      execution_domain_ref: domain
      account_ref: account
      account_refs: []
      strategy_ref: replace-with-registered-strategy-uuid
      run_id: run
      manual_book_ref: null
      portfolio_ref: null
      group_id: null
      leg_id: null
    identity:
      role: strategy_client
      principal_ref: principal
      actor_ref: replace-with-registered-strategy-uuid
      delegate_ref: null
  peer:
    role: service
    principal_ref: service-principal
    actor_ref: gateway
    delegate_ref: null
  # Optional: this strategy's own cash and value (broker.get_strategy_cash / get_strategy_value).
  # Uncomment this line and '- direct.strategy_financial' below only when the Gateway serves
  # strategy cash (its bundle has a strategy_financial section); otherwise the registration
  # is refused. Without a budget for this strategy in that section the reads are unavailable.
  # strategy_finance_currency: CNY
  requested_operations:
  - direct.release
  # - direct.strategy_financial
  - direct.delegated_command_status
  - direct.delegated_cancel
  - direct.delegated_cancel_status
  - direct.command_status
  - direct.cancel
  - direct.cancel_status
  - direct.events.read_after
  - direct.events.ack
  - direct.events.progress
  - direct.strategy_position
  - direct.strategy_close_capacity
  execution_time_policy:
    route: CTP___FUTURE
    timezone: Asia/Shanghai
    format: date_hms_seconds_v1
    schema_version: 1
  instruments_by_ref:
    SA701:
      provider: ctp
      venue: CZCE
      environment: demo
      product_type: future
      instrument_id: SA701
      native_symbol: SA701
  market_settings:
    requested_operations:
    - market.subscribe
    - market.unsubscribe
    - market.snapshot
    - market.head
    - market.read_after
    - market.bootstrap_begin
    - market.bootstrap_status
    - market.bootstrap_cancel
    - market.clock_observation
    subscriptions:
      SA701:
        key:
          source_ref: ctp-source
          entitlement_ref: market-entitlement
          instrument:
            provider: ctp
            venue: CZCE
            environment: demo
            product_type: future
            instrument_id: SA701
            native_symbol: SA701
          channel: tick
          depth: null
          timeframe: null
        require_source_descriptor: true
gateway_resource_files:
  security:
    server_public_key_file: state/keys/gateway.public
    client_public_key_file: state/keys/strategy.public
    client_secret_key_file: state/keys/strategy.secret
  risk-security:
    server_public_key_file: state/keys/risk.public
    client_public_key_file: state/keys/risk-strategy.public
    client_secret_key_file: state/keys/risk-strategy.secret
  execution-security:
    server_public_key_file: state/keys/execution.public
    client_public_key_file: state/keys/execution-strategy.public
    client_secret_key_file: state/keys/execution-strategy.secret
