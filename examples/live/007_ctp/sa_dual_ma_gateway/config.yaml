# Public placeholders only; provide protected key files and registered identities.
symbols:
- SA701
contracts:
  SA701:
    exchange: CZCE
    price_tick: 1.0
    multiplier: 20
    quantity_unit: contracts
    time_in_force: GFD
run_timeout_seconds: 0
feed:
  timeframe: minutes
  compression: 1
  backfill_start: false
  event_time_max_age: 2.0
  receive_time_max_age: 2.0
  incomplete_volume_bars: lines
  gateway_clock_verification: false
strategy_params:
  fast_period: 5
  slow_period: 20
  order_size: 1
  price_tick: 1.0
  slippage_ticks: 2
  print_log: true
trade_logger:
  enabled: true
logging:
  level: INFO
  other_level: WARNING
broker:
  position_mode: net
gateway_resource_provider: local_files
gateway_strategy:
  schema_version: 1
  exchange_name: CTP___FUTURE
  client_config:
    client_config_schema_version: 1
    process_role: strategy_client
    registration:
      strategy_ref: replace-with-registered-strategy-uuid
    clients:
      gateway:
        config_schema_version: 1
        settings:
          bindings:
          - mount: broker.direct_write
            service_id: gateway
            instance_id: instance
            scope_ref: scope
            account_ref: account
            transport_ref: transport
          - mount: store.market
            service_id: gateway
            instance_id: instance
            scope_ref: scope
            transport_ref: transport
    communication:
      config_schema_version: 1
      profiles:
        transport:
          backend: zmq
          config_schema_version: 1
          endpoints:
            rpc_connect: tcp://127.0.0.1:12345
            market_connect: tcp://127.0.0.1:12346
          security_profile_ref: security
  binding:
    journal_id: journal
    account_scope: account
    strategy_scope: replace-with-registered-strategy-uuid
    principal: principal
  route:
    mount: broker.direct_write
    service_id: gateway
    instance_id: instance
    scope_ref: scope
    scope:
      execution_domain_ref: domain
      account_ref: account
      account_refs: []
      strategy_ref: replace-with-registered-strategy-uuid
      run_id: run
      manual_book_ref: null
      portfolio_ref: null
      group_id: null
      leg_id: null
    identity:
      role: strategy_client
      principal_ref: principal
      actor_ref: replace-with-registered-strategy-uuid
      delegate_ref: null
  peer:
    role: service
    principal_ref: service-principal
    actor_ref: gateway
    delegate_ref: null
  requested_operations:
  - direct.reserve
  - direct.release
  - direct.dispatch
  - direct.command_status
  - direct.cancel
  - direct.cancel_status
  - direct.events.read_after
  - direct.events.ack
  - direct.events.progress
  - direct.strategy_position
  - direct.strategy_close_capacity
  execution_time_policy:
    route: CTP___FUTURE
    timezone: Asia/Shanghai
    format: date_hms_seconds_v1
    schema_version: 1
  instruments_by_ref:
    SA701:
      provider: ctp
      venue: CZCE
      environment: demo
      product_type: future
      instrument_id: SA701
      native_symbol: SA701
  market_settings:
    requested_operations:
    - market.subscribe
    - market.unsubscribe
    - market.snapshot
    - market.head
    - market.read_after
    - market.bootstrap_begin
    - market.bootstrap_status
    - market.bootstrap_cancel
    - market.clock_observation
    subscriptions:
      SA701:
        key:
          source_ref: ctp-source
          entitlement_ref: market-entitlement
          instrument:
            provider: ctp
            venue: CZCE
            environment: demo
            product_type: future
            instrument_id: SA701
            native_symbol: SA701
          channel: tick
          depth: null
          timeframe: null
        require_source_descriptor: true
gateway_resource_files:
  security:
    server_public_key_file: state/keys/gateway.public
    client_public_key_file: state/keys/strategy.public
    client_secret_key_file: state/keys/strategy.secret
