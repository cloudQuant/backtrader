# SA (soda ash) on CZCE; common active months are 01, 05 and 09.
# SA701 is the furthest SA contract SimNow lists as of 2026-11; roll it as it expires.
symbols:
- SA701
contracts:
  # A contract may also set event_time_max_age, receive_time_max_age and
  # incomplete_volume_bars (overrides of feed:), e.g. a quiet one: receive_time_max_age: 10.0
  SA701:
    exchange: CZCE
    price_tick: 1.0
    multiplier: 20
run_timeout_seconds: 0
ctp:
  env_profile: set1_group1_vpn      # SimNow standard environment (trading hours only)
  instrument_environment: demo      # SDK route environment of SimNow (production for a live account)
  broker_id: "9999"
  app_id: simnow_client_test
  auth_code: "0000000000000000"
  private_topic_mode: quick   # restart replays the day on login: slow on SimNow in trading hours (I62-01a)
direct:
  write_admission: true             # SDK write admission for CTP___FUTURE (D62-01)
  market_clock_verification: true   # SNTP + venue time qualification of ticks (D62-21)
  # market_clock_verification may also be a mapping: the same as true, with these
  # SDK keys (defaults shown; an unknown key makes the start fail):
  # market_clock_verification:
  #   max_latency_seconds: 2.0        # SDK source->receive limit (D62-28/37)
  #   max_error_bound_ms: 500         # largest accepted SNTP error bound
  #   validity_seconds: 900           # lifetime of one SNTP measurement
  #   refresh_interval_seconds: 300   # background SNTP refresh
  #   timeout_seconds: 2.0            # per SNTP query
  #   servers: [time.apple.com, cn.pool.ntp.org, ntp.aliyun.com]
broker:
  direct_facts_timeout: 60   # per query: whole-day orders/trades (SimNow ~14 rows/s)
  position_mode: net
  direct_funds_refresh_interval: 60      # D62-06a
  direct_position_audit_interval: 300    # D62-06b
  waiting_orders: true                   # D62-30: trusted closure -> wait for next session
  stop_cancel_timeout: 10                # D62-19: cancel own working orders on stop
feed:
  timeframe: minutes
  compression: 1
  backfill_start: false
  # Defaults of this venue and strategy (D62-28); contracts.<symbol> may override them.
  event_time_max_age: 2.0          # source event -> local receipt, seconds (only tightens the SDK limit)
  receive_time_max_age: 2.0        # local receipt -> order, seconds
  incomplete_volume_bars: lines    # lines | notify_only: volume-incomplete bars (2026-11-06)
strategy_params:
  fast_period: 5
  slow_period: 20
  order_size: 1
  price_tick: 1.0
  slippage_ticks: 2
  print_log: true
trade_logger:
  enabled: true
