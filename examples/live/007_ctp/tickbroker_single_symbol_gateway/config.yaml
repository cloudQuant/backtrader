# CTP SimNow, Gateway mode (iteration 62, step 62.08): see README.md and ../README.md.
# Market data comes from the Gateway CTP MarketHub (gateway_host.py); orders use the SDK
# direct write path (gateway.orders: direct). gateway.orders: managed is BLOCKED for now.
symbols:
- rb2701
contracts:
  # A contract may also set event_time_max_age, receive_time_max_age and
  # incomplete_volume_bars (overrides of feed:), e.g. a quiet one: receive_time_max_age: 10.0
  rb2701:
    exchange: SHFE
    price_tick: 1.0
    multiplier: 10
run_timeout_seconds: 150
ctp:
  instrument_environment: demo   # SDK route label of SimNow (Gateway keys too)
  broker_id: '9999'
  app_id: simnow_client_test
  auth_code: '0000000000000000'
  private_topic_mode: quick   # restart replays the day on login: slow on SimNow in trading hours (I62-01a)
gateway:
  ctp_profile: set1_group1_vpn   # SimNow standard environment (trading hours only)
  orders: direct     # direct (runnable) | managed (BLOCKED, see README)
  market_check_seconds: 60
  execution:
    write_admission: true   # SDK admission of gateway_host.py --managed-boot-check
direct:
  write_admission: true
  market_clock_verification: true
  # market_clock_verification may also be a mapping: the same as true, with these
  # SDK keys (defaults shown; an unknown key makes the start fail):
  # market_clock_verification:
  #   max_latency_seconds: 2.0        # SDK source->receive limit (D62-28/37)
  #   max_error_bound_ms: 500         # largest accepted SNTP error bound
  #   validity_seconds: 900           # lifetime of one SNTP measurement
  #   refresh_interval_seconds: 300   # background SNTP refresh
  #   timeout_seconds: 2.0            # per SNTP query
  #   servers: [time.apple.com, cn.pool.ntp.org, ntp.aliyun.com]
broker:
  direct_facts_timeout: 60   # per query: whole-day orders/trades (SimNow ~14 rows/s)
  position_mode: net
  direct_funds_refresh_interval: 60
  direct_position_audit_interval: 300
  waiting_orders: true
  stop_cancel_timeout: 10
feed:
  timeframe: ticks
  compression: 1
  backfill_start: false
  # Defaults of this venue and strategy (D62-28); contracts.<symbol> may override them.
  event_time_max_age: 2.0          # source event -> local receipt, seconds (only tightens the SDK limit)
  receive_time_max_age: 2.0        # local receipt -> order, seconds
  incomplete_volume_bars: lines    # lines | notify_only: volume-incomplete bars (2026-11-06)
strategy_params:
  symbol: rb2701
  tick_window: 2
  entry_bias: 0.0
  exit_bias: 0.0
  order_size: 1
  max_roundtrips: 1
  open_offset: open
  close_offset: auto
  stop_after_ticks: 150
  printlog: true
  force_entry_after_ticks: 2
  force_exit_after_ticks: 6
  cancel_pending_after_ticks: 12
  order_exectype: limit
  price_tick: 1.0
  slippage_ticks: 2
trade_logger:
  log_value: false
  log_positions: false
  log_position_snapshot: false
  enabled: true
