# M03 — recovery to a fresh user-data-stream session.
#
# This directory is self-contained: config.yaml + M03_strategy.py + run.py.
# Credentials are read by NAME from the checkout-root .env.
schema_version: 1
case_id: M03
venue: binance
description: "Recovery to a fresh user-data-stream session: a new listen key renews successfully and is cleaned up."
environment:
  name: demo
  kind: sandbox
  base_url: demo-fapi.binance.com
credentials:
  api_key_env: BINANCE_DEMO_API_KEY
  secret_env: BINANCE_DEMO_SECRET
policy:
  allow_write: false
  allow_dangerous: false
  max_orders: 1
  max_notional_usdt: 150
  symbol_allowlist: [BTCUSDT]
timeouts:
  request_seconds: 10
scenario:
  symbol: BTCUSDT
topology:
  transport: direct           # direct | gateway_zmq
  execution: false            # optional components
  risk: false
  monitor: false
