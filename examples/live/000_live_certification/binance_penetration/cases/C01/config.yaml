# C01 — authenticated session with baseline account-scope reads.
#
# This directory is self-contained: config.yaml + C01_strategy.py + run.py.
# Credentials are read by NAME from the checkout-root .env.
schema_version: 1
case_id: C01
venue: binance
description: "Authenticated demo session in hedge mode: baseline balances, position-risk and open-order reads all complete."
environment:
  name: demo
  kind: sandbox
  base_url: demo-fapi.binance.com
credentials:
  api_key_env: BINANCE_DEMO_API_KEY
  secret_env: BINANCE_DEMO_SECRET
policy:
  allow_write: false
  allow_dangerous: false
  max_orders: 1
  max_notional_usdt: 150
  symbol_allowlist: [BTCUSDT]
timeouts:
  request_seconds: 10
scenario:
  symbol: BTCUSDT
topology:
  transport: direct           # direct | service
  execution: false            # optional components
  risk: false
  monitor: false
service_client:
  client_config_path: service-client.example.yaml
  principal_ref: binance-c01
  domain_ref: binance-demo-domain
  service_principal_ref: binance-account-host
  curve_keys:
    binance-c01-account-curve-v1:
      server_key_env: BINANCE_C01_SERVICE_SERVER_PUBLIC_KEY
      public_key_env: BINANCE_C01_SERVICE_CLIENT_PUBLIC_KEY
      secret_key_env: BINANCE_C01_SERVICE_CLIENT_SECRET_KEY
  account:
    account_ref: binance-demo-account
    account_key:
      provider: binance
      venue: binance
      environment: demo
      account_id: binance-demo-owner
      subaccount_id: null
    required_coverage:
      - product_type: usdm_perpetual
        margin_pool: cross
