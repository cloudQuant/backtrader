# TH06 — the repeated-submits-in-window threshold fires exactly one alert.
#
# This directory is self-contained: config.yaml + TH06_strategy.py + run.py.
# Credentials are read by NAME from the checkout-root .env.
schema_version: 1
case_id: TH06
venue: binance
description: "Repeated-submits-in-window threshold: bounded resting orders inside the window trigger exactly one repeated_threshold monitor alert."
environment:
  name: demo
  kind: sandbox
  base_url: demo-fapi.binance.com
credentials:
  api_key_env: BINANCE_DEMO_API_KEY
  secret_env: BINANCE_DEMO_SECRET
policy:
  allow_write: true
  allow_dangerous: true
  max_orders: 3
  max_notional_usdt: 150
  symbol_allowlist: [BTCUSDT]
timeouts:
  request_seconds: 10
scenario:
  symbol: BTCUSDT
  side: BUY
  position_side: LONG
  quantity: "0.001"
  price_offset_bps: 200        # buy 2% below mark: rests inside the venue ±5% price band
  order_type: LIMIT
  time_in_force: GTC
  monitor: {repeated_threshold: 3, window_seconds: 60}
  order_interval_ms: 800
  accept_timeout_ms: 8000
  cancel_timeout_ms: 8000
topology:
  transport: direct           # direct | gateway_zmq
  execution: false            # optional components
  risk: false
  monitor: false
