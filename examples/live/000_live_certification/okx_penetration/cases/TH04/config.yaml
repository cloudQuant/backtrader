schema_version: 1
case_id: TH04
venue: okx
description: "Combined submit+cancel threshold: bounded resting orders and their cancels trigger exactly one combined_threshold monitor alert."
environment:
  name: demo
  kind: sandbox
  base_url: www.okx.com
  simulated: true
credentials:
  api_key_env: OKX_DEMO_API_KEY
  secret_env: OKX_DEMO_SECRET
  passphrase_env: OKX_DEMO_PASSPHRASE
policy:
  allow_write: true
  allow_dangerous: true
  max_orders: 5
  max_notional_usdt: 1200
  symbol_allowlist: [BTC-USDT-SWAP]
timeouts:
  request_seconds: 10
scenario:
  inst_id: BTC-USDT-SWAP
  side: buy
  size: "1"
  price_offset_bps: 200
  monitor: {combined_threshold: 10}
  order_interval_ms: 800
  accept_timeout_ms: 8000
  cancel_confirm_timeout_ms: 8000
topology:
  transport: direct
  execution: false
  risk: false
  monitor: false
