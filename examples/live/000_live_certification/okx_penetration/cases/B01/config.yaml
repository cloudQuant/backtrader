schema_version: 1
case_id: B01
venue: okx
description: "Two-order batch: a crossing order fills and a resting order is finally canceled (partial fills not producible on this engine)."
environment:
  name: demo
  kind: sandbox
  base_url: www.okx.com
  simulated: true
credentials:
  api_key_env: OKX_DEMO_API_KEY
  secret_env: OKX_DEMO_SECRET
  passphrase_env: OKX_DEMO_PASSPHRASE
policy:
  allow_write: true
  allow_dangerous: true
  max_orders: 6
  max_notional_usdt: 25000
  symbol_allowlist: [BTC-USDT-SWAP]
timeouts:
  request_seconds: 10
scenario:
  inst_id: BTC-USDT-SWAP
  order_volume: 5
  order_count: 2
  price_offset_bps: 200
  fill_poll_timeout_ms: 20000
  cancel_timeout_ms: 10000
  fill_timeout_ms: 15000
topology:
  transport: direct
  execution: false
  risk: false
  monitor: false
