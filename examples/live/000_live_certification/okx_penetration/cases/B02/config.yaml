schema_version: 1
case_id: B02
venue: okx
description: "Submit multiple bounded resting LIMIT orders, confirm each one is accepted and visible in the order queue, then cancel each and confirm the terminal canceled state."
environment:
  name: demo
  kind: sandbox
  base_url: www.okx.com
  simulated: true
credentials:
  api_key_env: OKX_DEMO_API_KEY
  secret_env: OKX_DEMO_SECRET
  passphrase_env: OKX_DEMO_PASSPHRASE
policy:
  allow_write: true
  allow_dangerous: false
  max_orders: 2
  max_notional_usdt: 1200
  symbol_allowlist: [BTC-USDT-SWAP]
timeouts:
  request_seconds: 10
scenario:
  inst_id: BTC-USDT-SWAP
  side: buy
  size: "1"
  price_offset_bps: 200
  order_count: 2
  order_interval_ms: 800
  accept_timeout_ms: 8000
  cancel_confirm_timeout_ms: 8000
topology:
  transport: direct
  execution: false
  risk: false
  monitor: false
