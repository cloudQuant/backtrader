# High-frequency calendar arbitrage: rebar dominant vs next-dominant quarterly.
#
# 迭代42 标准四件套配置（见 README.md）：
#   python run.py                       # 干跑自检：仅校验配置结构与凭据 env 名（不联网）
#   python run.py --replay [--scenario S]  # 离线回放：本地冻结 fixture，零网络零写入
#   python run.py --live --allow-write  # 真实 SimNow 模拟账户：rb 跨期双腿有界成交往返
#
# 上半部分（strategy 至 strategy_params）为冻结的策略/回放参数；
# 下半部分（schema_version 起）为迭代42 新增的标准入口段，仅被 run.py 的 dry/--live 使用。
# 凭据只按名从 checkout 根 .env 读取；本文件不含任何密钥。
strategy: PairArbitrageStrategy
symbols: [auto]          # auto -> dominant m + dominant RM (run.py resolves)
simnow_env: new_7x24
run_timeout_seconds: 180
broker:
  position_mode: net
  position_sync_policy: startup
# SimNow 账户查询在部分前置可能为空；保证金充足性由交易所权威判定。
  cash_check_enabled: false
  force_refresh_queries: false
  account_refresh_interval: 3600.0
  open_orders_refresh_interval: 3600.0
feed:
  timeframe: minutes
  compression: 1
  dispatch_ticks: true
  dispatch_bars: true
  backfill_start: false
  qcheck: 0.20
strategy_params:
  period: 60
  entry_z: 1.5
  exit_z: 0.3
  confirmations: 1
  min_interval: 0.1
  order_lots: 1
  max_pairs: 5
  max_loss: 2000.0
  max_holding_seconds: 120.0
  slippage_ticks: 2.0
  tick_size: 1.0

# ---------------------------------------------------------------------------
# 迭代42 标准入口段（dry / --live 使用；--replay 走冻结合成回放不读此段）
# ---------------------------------------------------------------------------
schema_version: 2
venue: simnow
credentials:
  broker_id_env: CTP_BROKER_ID
  user_id_env: CTP_USER_ID
  password_env: CTP_PASSWORD
  app_id_env: CTP_APP_ID
  auth_code_env: CTP_AUTH_CODE
# live 合约：symbols=auto 时按日期解析 rb 主力与次主力季度合约（SHFE 4 位）；
# 也可显式列出两个字面合约。exchanges 以品种前缀映射交易所（真实交易所元数据）。
live_contracts:
  symbols: auto
  exchanges:
    rb: SHFE
# 1–8 组完整 MD/TD pair（env 名）。选择规则见 simnow_direct.select_front_pair：
# 每端 ≥1/3 探测成功即可选；时段内优先 standard、时段外优先 7x24；按 max(成功中位延迟)
# 排序、配置序破平；自动选择/回退只发生在首次写入之前。
fronts:
  pairs:
    - {td_env: CTP_TD_FRONT, md_env: CTP_MD_FRONT, kind: standard}
    - {td_env: CTP_SET1_TD_FRONT_1, md_env: CTP_SET1_MD_FRONT_1, kind: standard}
    - {td_env: CTP_SET1_TD_FRONT_2, md_env: CTP_SET1_MD_FRONT_2, kind: standard}
    - {td_env: CTP_SET1_TD_FRONT_3, md_env: CTP_SET1_MD_FRONT_3, kind: standard}
    - {td_env: CTP_SET2_TD_FRONT, md_env: CTP_SET2_MD_FRONT, kind: 7x24}
# MD 登录兼容：本账号所用 SimNow 前置以请求编号 0 + 空身份字段回应登录
# （行情采集兼容形态，仅开放行情订阅身份，不产生执行身份）；TD 身份仍严格校验。
live_market_data:
  allow_zero_login_response: true
# 每条腿的合约元数据期望（按品种）：preflight 用真实 instruments 查询逐项核对。
instrument_metadata:
  rb:
    price_tick: 1
    volume_multiple: 10
    minimum_order_lots: 1
policy:
  # 配置不能自我授权写入；--allow-write 必须在命令行显式给出。
  allow_write: false
  max_actions: 40            # 报单+撤单尝试次数上限（每次请求消耗预算）
  max_position_lots: 2       # 双腿各 1 手的毛持仓上限
  max_fill_round_trips: 1    # 本轮验收允许的成交往返轮数
  cleanup_reserve_actions: 12
timeouts:
  login_seconds: 30
  query_seconds: 8
  stop_seconds: 12
  run_seconds: 1800          # live 运行窗口（单调时钟）
  drain_seconds: 120
# drill（受控演练单）：无自然信号时的兜底；触发窗口与持有时长由 run.py 命令行界定。
drill:
  enabled: true
  max_round_trips: 1
  hold_seconds: 180          # drill 建仓后按持有上限确定性平仓
