schema_version: ctp-options-candidate.v1
candidate_id: iter25-options-replay-v1

# Frozen SimNow environment family.  The default is the first set, which is the
# environment the Iteration 25 G3 gate requires.  Only the keys of the example's
# ENVIRONMENT_PROFILES table are accepted; the SDK owns the front pairs, and the
# runtime may fall back to the frozen alternate pair of the *same* family when
# the nominal pair is unreachable.  Override with ITER30_SIMNOW_PROFILE.
environment: simnow_first_group1

# This directory is directly runnable on its own.  Its default is therefore
# the deterministic, zero-network/zero-write formula replay.  Explicit
# shadow/simnow/production requests still fail closed before a session can be
# constructed because this example has no external adapter.
mode: replay
purpose: formula
production_enabled: false

contracts:
  exchange: CZCE
  future: FG701
  call: FG701C970
  put: FG701P970

feed:
  timeframe: ticks
  dispatch_ticks: true
  dispatch_bars: false
  max_quote_age_ms: 250
  max_cross_leg_skew_ms: 100
  max_source_age_upper_ms: 250
  max_source_skew_upper_ms: 100
  max_source_clock_error_ms: 5
  complete_cohort_confirmations: 2

# HF-T1 timing is a local, read-only projection contract. This replay has no
# current SDK/Broker execution-fact provider, so it cannot claim a live risk
# projection or grant. Synthetic fixtures exercise the immutable model only.
timing:
  provider_contract: explicit_immutable_same_scope_read_model_v1
  runtime_provider: unavailable
  synthetic_fixtures_only: true
  leg_timeout_ms: 1000
  unhedged_timeout_ms: 3000
  maximum_holding_timeout_ms: 60000
  idle_interval_ms: 50

risk:
  capital_cap_cny: 10000
  working_cny: 8000
  recovery_reserve_cny: 2000
  daily_loss_limit_cny: 300
  basket_loss_limit_cny: 150
  lots_per_leg: 1
  max_cycles: 1

signal:
  entry_buffer_cny: 20
  total_reserve_cny: 20

execution:
  order_type: limit
  ordinary_requests_per_second: 2
  max_daily_write_attempts: 100
  max_daily_ordinary_attempts: 80
  safety_daily_reserved_attempts: 20

replay:
  fixture: fixtures/three_leg_tick_cohorts_v1.json
  scenario: valid_cohort
  starting_cash: 100000

# ---------------------------------------------------------------------------
# Iteration-42 live observation adapter (consumed by the standard run.py live
# tier only; legacy_runner.load_config strips this section so the frozen
# replay contract keeps its strict key set).
live_adapter:
  schema_version: 1
  venue: simnow
  credentials:
    broker_id_env: CTP_BROKER_ID
    user_id_env: CTP_USER_ID
    password_env: CTP_PASSWORD
    app_id_env: CTP_APP_ID
    auth_code_env: CTP_AUTH_CODE
  fronts:
    # Ordered whole MD/TD candidate pairs probed credential-free for
    # reachability; the first eligible pair is selected and passed unchanged.
    pairs:
      - {td_env: CTP_TD_FRONT, md_env: CTP_MD_FRONT, kind: standard}
      - {td_env: CTP_SET1_TD_FRONT_1, md_env: CTP_SET1_MD_FRONT_1, kind: standard}
      - {td_env: CTP_SET1_TD_FRONT_2, md_env: CTP_SET1_MD_FRONT_2, kind: standard}
      - {td_env: CTP_SET1_TD_FRONT_3, md_env: CTP_SET1_MD_FRONT_3, kind: standard}
      - {td_env: CTP_SET2_TD_FRONT, md_env: CTP_SET2_MD_FRONT, kind: 7x24}
  live_market_data:
    allow_zero_login_response: true
  # Real contract identities (FG701 C/P970, matching the frozen fixture
  # bundle); identities only, no fabricated evidence.
  live_candidate:
    exchange: CZCE
    contracts: {future: CZCE.FG701, call: CZCE.FG701C970, put: CZCE.FG701P970}
  instrument_metadata:
    CZCE.FG701: {price_tick: 1.0, volume_multiple: 20}
    CZCE.FG701C970: {price_tick: 0.5, volume_multiple: 20}
    CZCE.FG701P970: {price_tick: 0.5, volume_multiple: 20}
  policy:
    allow_write: false
  timeouts:
    login_seconds: 30
    query_seconds: 8
    stop_seconds: 12
    run_seconds: 600
    drain_seconds: 120
  observation:
    min_ticks_per_leg: 1
