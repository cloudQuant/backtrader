example_id: 026_factor_multi

data:
  directory: ../../../tests/datas/a_stocks
  max_symbols: 500
  group: all_symbols
  snapshot_id: a-stocks-daily-2025
  price_basis: source prices as provided; no adjustment
  calendar_id: source-observed-daily-v1
  frequency: 1source_observed_session
  source_timezone: Asia/Shanghai
  data_version: a-stocks-daily-2025

factors:
  close_ma:
    panel_line: factor
    params:
      period: 20
    direction: 1
  kdj_j:
    panel_line: factor
    params:
      period: 9
      period_dfast: 3
      period_dslow: 3
    direction: 1
  roc:
    panel_line: factor
    params:
      period: 20
    direction: 1

evaluation:
  periods: [1, 5, 20]
  label: next_open_to_open
  precomputed_entry: next_open
  quantiles: 5
  min_assets: 10
  min_quantile_assets: 1
  preprocess: cross_section_rank
  max_loss: 1.0  # real panel: keep every evaluable cell, no artificial loss cap
  stability_lags: [1, 5, 20]
  combinations:
    equal_weight:
      close_ma: 1.0
      roc: 1.0
      kdj_j: 1.0
  comparisons:
    ma_vs_roc: [close_ma, roc]
    ma_vs_kdj: [close_ma, kdj_j]
    ma_vs_equal_weight: [close_ma, equal_weight]
