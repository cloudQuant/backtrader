example_id: 025_factor_single

data:
  directory: ../../../tests/datas/a_stocks
  max_symbols: 500
  group: all_symbols
  snapshot_id: a-stocks-daily-2025
  price_basis: source prices as provided; no adjustment
  calendar_id: source-observed-daily-v1
  frequency: 1source_observed_session
  source_timezone: Asia/Shanghai
  data_version: a-stocks-daily-2025

factor:
  name: close_ma
  panel_line: factor
  params:
    period: 20
  direction: 1

evaluation:
  periods: [1, 5, 20]
  label: next_open_to_open
  precomputed_entry: next_open
  quantiles: 5
  min_assets: 10
  min_quantile_assets: 1
  preprocess: cross_section_rank
  max_loss: 1.0  # real panel: keep every evaluable cell, no artificial loss cap
  stability_lags: [1, 5, 20]
