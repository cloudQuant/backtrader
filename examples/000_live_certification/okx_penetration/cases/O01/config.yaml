schema_version: 1
case_id: O01
venue: okx
description: "Repeated open submissions: place several resting LIMIT orders and require exactly one monitor order_insert event per submission, then cancel all to terminal."
environment:
  name: demo
  kind: sandbox
  base_url: www.okx.com
  simulated: true
credentials:
  api_key_env: OKX_DEMO_API_KEY
  secret_env: OKX_DEMO_SECRET
  passphrase_env: OKX_DEMO_PASSPHRASE
policy:
  allow_write: true
  allow_dangerous: true
  max_orders: 3
  max_notional_usdt: 1200
  symbol_allowlist: [BTC-USDT-SWAP]
timeouts:
  request_seconds: 10
scenario:
  inst_id: BTC-USDT-SWAP
  side: buy
  size: "1"
  price_offset_bps: 200
  repeat_count: 3
  order_interval_ms: 800
  accept_timeout_ms: 8000
  cancel_confirm_timeout_ms: 8000
topology:
  transport: direct
  execution: false
  risk: false
  monitor: false
