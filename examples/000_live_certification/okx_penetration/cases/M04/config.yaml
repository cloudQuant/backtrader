schema_version: 1
case_id: M04
venue: okx
description: "Monitor observes the order submission: place one resting LIMIT order, require the local monitor to record an order_insert event for it, then cancel it to terminal."
environment:
  name: demo
  kind: sandbox
  base_url: www.okx.com
  simulated: true
credentials:
  api_key_env: OKX_DEMO_API_KEY
  secret_env: OKX_DEMO_SECRET
  passphrase_env: OKX_DEMO_PASSPHRASE
policy:
  allow_write: true
  allow_dangerous: false
  max_orders: 1
  max_notional_usdt: 1200
  symbol_allowlist: [BTC-USDT-SWAP]
timeouts:
  request_seconds: 10
scenario:
  inst_id: BTC-USDT-SWAP
  side: buy
  size: "1"
  price_offset_bps: 200
  accept_timeout_ms: 8000
  cancel_confirm_timeout_ms: 8000
topology:
  transport: direct
  execution: false
  risk: false
  monitor: false
