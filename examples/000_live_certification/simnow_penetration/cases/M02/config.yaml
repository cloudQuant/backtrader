# C01 — authenticated login / valid session on the same account.
#
# This directory is self-contained: config.yaml + C01_strategy.py + run.py.
# Credentials are read by NAME from the checkout-root .env.
schema_version: 1
case_id: M02
venue: simnow
description: "External disconnect observation: a competing login on the same account makes the observed session show a native disconnect within the bounded window."
environment:
  name: simnow
  kind: simulation
credentials:
  broker_id_env: CTP_BROKER_ID
  user_id_env: CTP_USER_ID
  password_env: CTP_PASSWORD
  app_id_env: CTP_APP_ID
  auth_code_env: CTP_AUTH_CODE
contract:
  instrument_env: CTP_INSTRUMENT
  exchange_env: CTP_EXCHANGE
  hedge_flag_env: CTP_HEDGE_FLAG
fronts:
  pairs:
    - {td_env: CTP_TD_FRONT, md_env: CTP_MD_FRONT}
    - {td_env: CTP_SET1_TD_FRONT_1, md_env: CTP_SET1_MD_FRONT_1}
    - {td_env: CTP_SET1_TD_FRONT_2, md_env: CTP_SET1_MD_FRONT_2}
    - {td_env: CTP_SET1_TD_FRONT_3, md_env: CTP_SET1_MD_FRONT_3}
    - {td_env: CTP_SET2_TD_FRONT, md_env: CTP_SET2_MD_FRONT}
sdk:
  root_env: BT_API_PY_ROOT
  default_root: D:/bt_api_py
timeouts:
  login_seconds: 30
  query_seconds: 8
  stop_seconds: 12
policy:
  allow_write: false
  allow_dangerous: false
scenario:
  expect: external_disconnect
  disconnect_timeout_ms: 20000
topology:
  transport: direct
  execution: false
  risk: false
  monitor: false
