# C01 — authenticated login / valid session on the same account.
#
# This directory is self-contained: config.yaml + C01_strategy.py + run.py.
# Credentials are read by NAME from the checkout-root .env.
schema_version: 1
case_id: EM03
venue: simnow
description: "External operator logout: the operator-authorized venue logout API (scenario logout_mode: venue_api, default) issues ReqUserLogout, requires an observed termination signal plus a ghost session, and restores a fresh session afterwards; a competing login (any other logout_mode) or a human-triggered server-side forced logout during the operator-assist hold window (scenario hold_seconds > 0, or BT_CERT_EM03_HOLD_SECONDS while hold_seconds is 0) remain available. Read-only; no write action is used."
environment:
  name: simnow
  kind: simulation
credentials:
  broker_id_env: CTP_BROKER_ID
  user_id_env: CTP_USER_ID
  password_env: CTP_PASSWORD
  app_id_env: CTP_APP_ID
  auth_code_env: CTP_AUTH_CODE
contract:
  instrument_env: CTP_INSTRUMENT
  exchange_env: CTP_EXCHANGE
  hedge_flag_env: CTP_HEDGE_FLAG
fronts:
  pairs:
    - {td_env: CTP_TD_FRONT, md_env: CTP_MD_FRONT}
    - {td_env: CTP_SET1_TD_FRONT_1, md_env: CTP_SET1_MD_FRONT_1}
    - {td_env: CTP_SET1_TD_FRONT_2, md_env: CTP_SET1_MD_FRONT_2}
    - {td_env: CTP_SET1_TD_FRONT_3, md_env: CTP_SET1_MD_FRONT_3}
    - {td_env: CTP_SET2_TD_FRONT, md_env: CTP_SET2_MD_FRONT}
sdk:
  root_env: BT_API_PY_ROOT
  default_root: D:/bt_api_py
timeouts:
  login_seconds: 30
  query_seconds: 8
  stop_seconds: 12
policy:
  allow_write: false
  allow_dangerous: false
scenario:
  expect: forced_logout
  operator_ref: operator-cert-em03
  authorization_ref: auth-cert-em03
  # venue_api = operator-authorized ReqUserLogout on the observed session
  # (the certification default); any other value keeps the competing-login
  # quick path.
  logout_mode: venue_api
  disconnect_timeout_ms: 20000
  # Operator-assist hold window in seconds (0 = competing-login probe only;
  # clamped to [0, 1800]; BT_CERT_EM03_HOLD_SECONDS overrides a 0 here).
  hold_seconds: 0
topology:
  transport: direct
  execution: false
  risk: false
  monitor: false
