# M05 — the local monitor records submit and cancel.
#
# This directory is self-contained: config.yaml + M05_strategy.py + run.py.
# Credentials are read by NAME from the checkout-root .env.
schema_version: 1
case_id: M05
venue: binance
description: "Monitor observes submit and cancel: place one resting LIMIT order, require monitor order_insert and order_action events for it, then confirm the terminal canceled state."
environment:
  name: demo
  kind: sandbox
  base_url: demo-fapi.binance.com
credentials:
  api_key_env: BINANCE_DEMO_API_KEY
  secret_env: BINANCE_DEMO_SECRET
policy:
  allow_write: true
  allow_dangerous: false
  max_orders: 1
  max_notional_usdt: 150
  symbol_allowlist: [BTCUSDT]
timeouts:
  request_seconds: 10
scenario:
  symbol: BTCUSDT
  side: BUY
  position_side: LONG
  quantity: "0.001"
  price_offset_bps: 200        # buy 2% below mark: rests inside the venue ±5% price band
  order_type: LIMIT
  time_in_force: GTC
  accept_timeout_ms: 8000
  cancel_timeout_ms: 8000
topology:
  transport: direct           # direct | gateway_zmq
  execution: false            # optional components
  risk: false
  monitor: false
