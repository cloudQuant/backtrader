# E01 — venue rejection: insufficient margin on a deliberately oversized order.
#
# This directory is self-contained: config.yaml + E01_strategy.py + run.py.
# Credentials are read by NAME from the checkout-root .env.
schema_version: 1
case_id: E01
venue: binance
description: "Submit one deliberately oversized resting BUY LIMIT order and record the venue margin rejection code/message; no order may be created and no residual may remain."
environment:
  name: demo
  kind: sandbox
  base_url: demo-fapi.binance.com
credentials:
  api_key_env: BINANCE_DEMO_API_KEY
  secret_env: BINANCE_DEMO_SECRET
policy:
  allow_write: true
  allow_dangerous: false
  max_orders: 1
  max_notional_usdt: 5000000    # set above the probe size on purpose: rejection must come from the venue
  symbol_allowlist: [BTCUSDT]
timeouts:
  request_seconds: 10
scenario:
  symbol: BTCUSDT
  side: BUY
  position_side: LONG
  oversize_quantity: "50"     # ~4.1M USDT at BTC mark: far above demo margin, venue must reject
  price_offset_bps: 200       # buy 2% below mark: inside the venue ±5% band so only margin can reject
  order_type: LIMIT
  time_in_force: GTC
  expect: insufficient_margin
  expect_codes: [-2019]
  cancel_confirm_timeout_ms: 8000
topology:
  transport: direct           # direct | gateway_zmq
  execution: false            # optional components
  risk: false
  monitor: false
