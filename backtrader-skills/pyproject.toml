[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backtrader-skills"
version = "0.1.0"
description = "Offline, auditable strategy authoring, review, and test skills for Backtrader"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{ name = "Backtrader contributors" }]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.scripts]
backtrader-skills = "backtrader_skills.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/backtrader-skills" = ["IMPLEMENTATION_REPORT.md", "README.md", "manifest.json"]
"share/backtrader-skills/evidence" = ["evidence/*.json"]
"share/backtrader-skills/resources/contracts" = ["resources/contracts/*.json"]
"share/backtrader-skills/resources/policies" = ["resources/policies/*.json"]
"share/backtrader-skills/resources/snapshots" = ["resources/snapshots/*.jsonl"]
"share/backtrader-skills/resources/templates" = ["resources/templates/*.txt"]
"share/backtrader-skills/resources/fixtures" = ["resources/fixtures/*.json"]
"share/backtrader-skills/host_adapters" = ["host_adapters/*.json"]
"share/backtrader-skills/scripts" = ["scripts/*.py"]
"share/backtrader-skills/skills/backtrader-strategy-author" = [
  "skills/backtrader-strategy-author/SKILL.md",
]
"share/backtrader-skills/skills/backtrader-strategy-author/agents" = [
  "skills/backtrader-strategy-author/agents/openai.yaml",
]
"share/backtrader-skills/skills/backtrader-strategy-author/references" = [
  "skills/backtrader-strategy-author/references/*.md",
]
"share/backtrader-skills/skills/backtrader-strategy-author/scripts" = [
  "skills/backtrader-strategy-author/scripts/*.py",
]
"share/backtrader-skills/skills/backtrader-strategy-review" = [
  "skills/backtrader-strategy-review/SKILL.md",
]
"share/backtrader-skills/skills/backtrader-strategy-review/agents" = [
  "skills/backtrader-strategy-review/agents/openai.yaml",
]
"share/backtrader-skills/skills/backtrader-strategy-review/references" = [
  "skills/backtrader-strategy-review/references/*.md",
]
"share/backtrader-skills/skills/backtrader-strategy-review/scripts" = [
  "skills/backtrader-strategy-review/scripts/*.py",
]
"share/backtrader-skills/skills/backtrader-strategy-test" = [
  "skills/backtrader-strategy-test/SKILL.md",
]
"share/backtrader-skills/skills/backtrader-strategy-test/agents" = [
  "skills/backtrader-strategy-test/agents/openai.yaml",
]
"share/backtrader-skills/skills/backtrader-strategy-test/references" = [
  "skills/backtrader-strategy-test/references/*.md",
]
"share/backtrader-skills/skills/backtrader-strategy-test/scripts" = [
  "skills/backtrader-strategy-test/scripts/*.py",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "skip"
